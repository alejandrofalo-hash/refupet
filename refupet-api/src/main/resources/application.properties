
# ==========================================
# REFUPET - CONFIGURACIÓN GENERAL
# ==========================================

# Puerto del servidor
quarkus.http.port=8080

# Ruta base de la aplicación
quarkus.http.root-path=/


# ==========================================
# CONEXIÓN A MYSQL
# ==========================================

# Desactivar bases de datos automáticas
quarkus.devservices.enabled=false

# Motor de base de datos
quarkus.datasource.db-kind=mysql

# Credenciales mediante variables de entorno
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}

# URL de conexión a MySQL
quarkus.datasource.jdbc.url=${DB_URL}


# ==========================================
# HIBERNATE ORM / JPA
# ==========================================

# Actualizar el esquema durante desarrollo
%dev.quarkus.hibernate-orm.database.generation=update

# No modificar automáticamente el esquema
# en producción
%prod.quarkus.hibernate-orm.database.generation=none

# Mostrar consultas SQL durante desarrollo
%dev.quarkus.hibernate-orm.log.sql=true

# Ocultar consultas SQL en producción
%prod.quarkus.hibernate-orm.log.sql=false


# ==========================================
# AUTENTICACIÓN - QUARKUS SECURITY
# ==========================================

# Activar autenticación HTTP Basic
quarkus.http.auth.basic=true
